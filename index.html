<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Resolve theme before first paint to avoid a light/dark flash. Mirrors ThemeProvider. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('otl.theme');
          var pref = (stored === 'light' || stored === 'dark' || stored === 'system') ? stored : 'dark';
          var isDark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) { document.documentElement.classList.add('dark'); }
      })();
    </script>
    <!-- Favicon: noir-tiled monogram is the safe default (reads on any browser chrome). -->
    <link rel="icon" href="/favicon.png" type="image/png" sizes="180x180" />
    <!-- Dark-scheme browsers that honor the media hint can use the borderless ivory mark. -->
    <link rel="icon" href="/favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="512x512" />
    <meta name="theme-color" content="#21402C" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#EFE8DA" media="(prefers-color-scheme: light)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do venues discover artists?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Search the roster by city, date, genre and audience reach, and see who is genuinely free that night before you get in touch. Every artist keeps a profile with past rooms, music, photos and live follower numbers, so you can judge the fit first."
          }
        },
        {
          "@type": "Question",
          "name": "How do artists find work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Open slots and venue requests appear in one feed, filtered by city, date and the kind of night it is. You reply with your fee — no cold outreach, no missed calls."
          }
        },
        {
          "@type": "Question",
          "name": "How does posting a venue slot work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Put the night, the slot and what you need to the whole roster in one go. Matching artists are notified and respond with their fee, so you compare real offers side by side instead of guessing."
          }
        },
        {
          "@type": "Question",
          "name": "How are payments handled?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Fees are agreed in the app and paid through it, with secure transfers and receipts on both sides. On Tour Live charges a small platform fee on completed payments — we are software for artists and venues, not an agency, and we never book on your behalf."
          }
        },
        {
          "@type": "Question",
          "name": "How do reviews work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "After a night is marked complete, the artist and the venue can each leave a one to five star review. Ratings build up over time so both sides know who they are dealing with before agreeing anything."
          }
        },
        {
          "@type": "Question",
          "name": "What does it cost to join?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Creating a profile and using the app is free while we launch. Join the founding list above and we will email you the moment it opens in your city."
          }
        },
        {
          "@type": "Question",
          "name": "Who can join?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Artists of any size — DJs, bands, solo singers — and any venue that puts on live music, from small bars to clubs. We start in Sydney and open other cities from there."
          }
        },
        {
          "@type": "Question",
          "name": "What happens after I join the list?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You get one email confirming your place, then a note when the app opens in your city. No spam, and you can ask us to remove you at any time."
          }
        },
        {
          "@type": "Question",
          "name": "Do I have to accept every offer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Every slot and every offer is yours to accept, counter or ignore. Nothing is agreed until both sides confirm it in the app."
          }
        },
        {
          "@type": "Question",
          "name": "Is my information private?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Only what you put on your public profile is visible. Your email, messages and payment details stay private, and we never sell your details."
          }
        }
      ]
    }
    </script>
